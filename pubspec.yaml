name: save_points_animations
description: >-
  Fluent, chainable animations for any Flutter widget: one controller per
  chain, timelines, staggers, scroll triggers, physics, RTL and reduced motion.
version: 0.44.0
repository: https://github.com/m7hamed-dev/save_points_animations
issue_tracker: https://github.com/m7hamed-dev/save_points_animations/issues

topics:
  - animation
  - ui
  - motion
  - widgets
  - effects

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Tests only; the package itself depends on no design system. 1.0–1.3
  # resolve on Flutter 3.44, newer releases on 3.47+.
  material_ui: ^1.0.0
